name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fulcrum
          POSTGRES_PASSWORD: fulcrum
          POSTGRES_DB: fulcrum_test
        options: >-
          --health-cmd "pg_isready -U fulcrum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://fulcrum:fulcrum@localhost:5432/fulcrum_test?schema=public
      JWT_SIGNING_KEY: Y2ktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1zZWNyZXQ=
      TOTP_ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1zZWNyZXQ=
      APP_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      - name: Report assertion coverage
        if: always()
        run: node scripts/assertion-coverage.mjs

      - name: Build
        run: npm run build

      - name: Build the production image
        run: docker build -t fulcrum:ci .

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Full audit (informational)
        if: always()
        continue-on-error: true
        run: npm audit
