services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fulcrum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fulcrum}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fulcrum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fulcrum}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fulcrum}?schema=public
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_NAME: ${APP_NAME:-Fulcrum}
      TESTSSL_PATH: /app/vendor/testssl.sh/testssl.sh
      TESTSSL_TIMEOUT_MS: ${TESTSSL_TIMEOUT_MS:-300000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      EMAIL_API_PROVIDER: ${EMAIL_API_PROVIDER:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-2}
      SCAN_QUEUE_MAX_DEPTH: ${SCAN_QUEUE_MAX_DEPTH:-50}
      DOMAIN_VERIFICATION_TTL_DAYS: ${DOMAIN_VERIFICATION_TTL_DAYS:-90}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
      - egress

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fulcrum}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fulcrum}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - internal

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    entrypoint: ["sh", "/app/scripts/backup-loop.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fulcrum}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fulcrum}?schema=public
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      RESTORE_TEST_EVERY: ${RESTORE_TEST_EVERY:-7}
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:-}
      BACKUP_AFTER_CMD: ${BACKUP_AFTER_CMD:-}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./prisma/migrations:/app/prisma/migrations:ro
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'fulcrum-*.dump*' -mmin -2160 | grep -q ."]
      interval: 1h
      timeout: 10s
      start_period: 15m
      retries: 1
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

volumes:
  db-data:
  backups:

networks:
  internal:
    internal: true
  egress:
    driver: bridge
